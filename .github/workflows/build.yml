name: Build desktop artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: build:linux
            artifact: CREATE-99L-Ground-Station-Linux-x64
            path: release/*.AppImage
          - os: windows-latest
            command: build:win
            artifact: CREATE-99L-Ground-Station-Windows-x64
            path: release/*.exe
          - os: macos-latest
            command: build:mac
            artifact: CREATE-99L-Ground-Station-macOS
            path: release/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
